{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مدیریت فلش‌کارت‌ها - پنل مدیریت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #050505; color: #ededed; font-family: system-ui, sans-serif; margin: 0; padding: 0; min-height: 100vh; }
        .bg-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); background-size: cover; }
        .bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,5,0.8); z-index: -1; }
        .container { max-width: 850px; margin: 0 auto; padding: 40px 20px; box-sizing: border-box; }
        .card-box { background: rgba(15, 15, 20, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 30px; margin-bottom: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .form-control, textarea { width: 100%; background: rgba(20,20,25,0.9); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
        .form-control:focus, textarea:focus { outline: none; border-color: #0dcaf0; box-shadow: 0 0 10px rgba(13,202,240,0.25); }
        .btn-custom { background: #0dcaf0; color: #000; padding: 12px 24px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.3s; }
        .btn-custom:hover { background: #31d2f2; color: #fff; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h2>📦 افزودن و مدیریت فلش‌کارت‌های لایتنر</h2>
            <a href="{% url 'custom_admin' %}" class="btn-custom" style="background: rgba(255,255,255,0.1); color:#fff;">← بازگشت به پنل</a>
        </div>

        <div class="card-box">
            <h3 style="margin-top: 0; font-size: 18px; color: #0dcaf0;">افزودن فلش‌کارت جدید برای دانشجویان</h3>
            <!-- حتماً متد POST باشد -->
            <form method="POST">
                {% csrf_token %}
                <label style="font-size: 13px; color: #a3a1ad; display: block; margin-bottom: 5px;">نام دارو (روی کارت)</label>
                <input type="text" name="drug_name" class="form-control" required placeholder="مثلاً Amoxicillin">

                <label style="font-size: 13px; color: #a3a1ad; display: block; margin-bottom: 5px;">مشخصات و نکات بالینی دارو (پشت کارت)</label>
                <textarea name="back_text" class="form-control" rows="4" required placeholder="نکات کلیدی، مکانیسم اثر و دوز دارو..."></textarea>

                <button type="submit" class="btn-custom">ایجاد و انتشار فلش‌کارت</button>
            </form>
        </div>
    </div>
</body>
</html>

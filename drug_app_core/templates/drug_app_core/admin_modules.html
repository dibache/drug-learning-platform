{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مدیریت مباحث - پنل مدیریت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #050505; color: #ededed; font-family: system-ui, sans-serif; margin: 0; padding: 0; min-height: 100vh; }
        .bg-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); background-size: cover; }
        .bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,5,0.8); z-index: -1; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; box-sizing: border-box; }
        .card-box { background: rgba(15, 15, 20, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 30px; margin-bottom: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .form-control { width: 100%; background: rgba(20,20,25,0.9); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
        .form-control:focus { outline: none; border-color: #0dcaf0; box-shadow: 0 0 10px rgba(13,202,240,0.25); }
        .btn-custom { background: #0dcaf0; color: #000; padding: 12px 24px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.3s; }
        .btn-custom:hover { background: #31d2f2; color: #fff; transform: translateY(-2px); }
        .module-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h2>📖 مدیریت مباحث آموزشی</h2>
            <a href="{% url 'custom_admin' %}" class="btn-custom" style="background: rgba(255,255,255,0.1); color:#fff;">← بازگشت به پنل</a>
        </div>

        <div class="card-box">
            <h3 style="margin-top: 0; font-size: 18px; color: #0dcaf0;">افزودن مبحث جدید</h3>
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="title" class="form-control" required placeholder="عنوان مبحث (مثلاً آنتی‌بیوتیک‌ها)">
                <textarea name="description" class="form-control" rows="3" placeholder="توضیحات کوتاه مبحث..."></textarea>
                <input type="number" name="order" class="form-control" placeholder="ترتیب نمایش (عدد)" value="1">
                <button type="submit" class="btn-custom">ثبت و ایجاد مبحث</button>
            </form>
        </div>

       <div class="card-box">
            <h3 style="margin-top: 0; font-size: 18px; color: #0dcaf0;">افزودن مبحث جدید با تصویر</h3>
            <!-- اضافه کردن enctype برای پشتیبانی از ارسال فایل -->
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="text" name="title" class="form-control" required placeholder="عنوان مبحث (مثلاً آنتی‌بیوتیک‌ها)">
                <textarea name="description" class="form-control" rows="3" placeholder="توضیحات کوتاه مبحث..."></textarea>

                <!-- فیلد انتخاب تصویر -->
                <label style="font-size: 13px; color: #a3a1ad; display: block; margin-bottom: 5px;">تصویر مبحث (اختیاری)</label>
                <input type="file" name="image" class="form-control" accept="image/*" style="padding: 10px;">

                <input type="number" name="order" class="form-control" placeholder="ترتیب نمایش (عدد)" value="1">
                <button type="submit" class="btn-custom">ثبت و ایجاد مبحث</button>
            </form>
        </div>
    </div>
</body>
</html>

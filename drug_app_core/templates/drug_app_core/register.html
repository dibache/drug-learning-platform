{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام - سامانه اطلاعات دارویی</title>
    <style>
        body { 
            background-color: #050505; color: #ededed; font-family: system-ui, sans-serif; 
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow-x: hidden; 
        }

        .bg-image-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            background-position: center; background-size: cover;
        }

        .bg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(5,5,5,0.5) 0%, rgba(5,5,5,0.85) 100%); z-index: -1;
        }

        header {
            position: fixed; top: 0; right: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: flex-end; align-items: center; z-index: 1000;
            box-sizing: border-box;
        }
        
        .back-btn {
            color: #ccc; text-decoration: none; font-size: 14px; font-weight: 500; 
            text-transform: uppercase; letter-spacing: 2px; transition: color 0.3s;
        }
        .back-btn:hover { color: #fff; }

        /* --- فرم کاملاً شیشه‌ای و مدرن --- */
        .form-container {
            width: 90%; max-width: 480px; 
            background: rgba(15, 15, 20, 0.6);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 40px; border-radius: 24px; 
            border: 1px solid rgba(255,255,255,0.08); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); box-sizing: border-box;
            animation: fadeIn 0.6s ease forwards;
            margin-top: 40px;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .form-title { font-size: 28px; font-weight: 600; margin-bottom: 8px; color: #fff; text-align: center; }
        .form-subtitle { font-size: 13px; color: #888; text-align: center; margin-bottom: 25px; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #a3a1ad; margin-bottom: 8px; font-weight: 500; }
        
        input[type="text"], input[type="password"] {
            width: 100vw; max-width: 100%;
            background: rgba(20, 20, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 14px; border-radius: 12px; font-size: 15px; 
            box-sizing: border-box; transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type="text"]:focus, input[type="password"]:focus { 
            outline: none; border-color: #0dcaf0; box-shadow: 0 0 15px rgba(13, 202, 240, 0.25); 
        }

        .submit-btn {
            width: 100%; background: #fff; color: #000; border: none; padding: 15px; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; margin-top: 10px;
        }
        .submit-btn:hover { background: #0dcaf0; color: #fff; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(13, 202, 240, 0.3); }

        .error-message { color: #ff3b1d; font-size: 13px; text-align: center; margin-bottom: 15px; background: rgba(255,59,29,0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,59,29,0.2); }
        
        .login-link-container {
            text-align: center; margin-top: 22px; font-size: 13px;
        }
        .login-link-container span { color: #888; }
        .login-link-container a { 
            color: #0dcaf0; text-decoration: none; font-weight: 600; transition: color 0.3s; 
        }
        .login-link-container a:hover { color: #31d2f2; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="bg-image-container"></div>
    <div class="bg-overlay"></div>

    <header>
        <a href="{% url 'welcome' %}" class="back-btn">← صفحه اصلی</a>
    </header>

    <div class="form-container">
        <div class="form-title">ثبت‌نام دانشجو</div>
        <div class="form-subtitle">مشخصات کارآموزی خود را وارد کنید</div>

        <form method="POST" action="">
            {% csrf_token %}
            
            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}

            <div class="input-group">
                <label for="full_name">نام و نام خانوادگی</label>
                <input type="text" name="full_name" id="full_name" required autocomplete="off" placeholder="مثلاً دکتر علی رضایی">
            </div>

            <div class="input-group">
                <label for="student_id">شماره دانشجویی (یکتا)</label>
                <input type="text" name="student_id" id="student_id" required autocomplete="off" placeholder="مثلاً 40212345">
            </div>

            <div class="input-group">
                <label for="national_id">کد ملی</label>
                <input type="text" name="national_id" id="national_id" required autocomplete="off" placeholder="۱۰ رقمی">
            </div>

            <div class="input-group">
                <label for="password">رمز عبور دلخواه</label>
                <input type="password" name="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="submit-btn">تکمیل ثبت‌نام</button>

            <div class="login-link-container">
                <span>قبلاً ثبت‌نام کرده‌اید؟ </span>
                <a href="{% url 'login' %}">وارد شوید</a>
            </div>
        </form>
    </div>

</body>
</html>
